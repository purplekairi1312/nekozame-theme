# nekozame for tmux. generated from palette.toml by generate.py; edit the palette there.
# windows as rounded tabs (needs a nerd font for the round ends).
# use it with: source-file /path/to/nekozame.conf

set -g status-justify left
set -g status-style 'bg=#433a55 fg=#ffd4ee'
set -g status-left '#[fg=#ffc0e5,bold] ❀ #S  '
set -g status-left-length 30
set -g status-right '#[fg=#8a76a8]#[bg=#8a76a8,fg=#fff4fa] %H:%M #[bg=#433a55,fg=#8a76a8]'
set -g status-right-length 30
set -g window-status-separator ' '
setw -g window-status-format '#[fg=#8a76a8]#[bg=#8a76a8,fg=#fff4fa] #I #W #[bg=#433a55,fg=#8a76a8]'
setw -g window-status-current-format '#[fg=#ffc0e5]#[bg=#ffc0e5,fg=#433a55,bold] #I #W #[bg=#433a55,fg=#ffc0e5]'
setw -g window-status-bell-style 'fg=#433a55 bg=#ffb3c8 bold'

set -g pane-border-style 'fg=#8a76a8'
set -g pane-active-border-style 'fg=#ffc0e5'
set -g message-style 'fg=#433a55 bg=#ffd4ee bold'
set -g message-command-style 'fg=#433a55 bg=#ffd4ee'
setw -g mode-style 'fg=#433a55 bg=#ffc0e5 bold'
setw -g clock-mode-colour '#ffc0e5'
