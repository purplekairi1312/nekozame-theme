# nekozame for tracker (https://github.com/ShenMian/tracker), the satellite map
# in the terminal. generated from palette.toml by generate.py; edit the palette there.
# Needs a truecolor terminal. Anything left out keeps tracker's default.

[world_map]
# the lit side of the Earth; the night side is a darker shade of it
day_color = "#5a4f6e"
coast_color = "#e3ccff"
trajectory_color = "#ffc0e5"
terminator_color = "#a094b8"
visibility_area_color = "#fff1b0"
