; nekozame for qt apps outside kde (qt6ct and qt5ct). generated from
; palette.toml by generate.py; edit the palette there. goes in
; ~/.config/qt6ct/colors/ (and qt5ct/colors/), then pick it in qt6ct.
; the roles, in order: window text, button, light, midlight, dark, mid, text,
; bright text, button text, base, window, shadow, highlight, highlighted text,
; link, visited link, alternate base, no role, tooltip base, tooltip text,
; placeholder text, accent
