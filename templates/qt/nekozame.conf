; nekozame for qt apps outside kde (qt6ct and qt5ct). generated from
; palette.toml by generate.py; edit the palette there. goes in
; ~/.config/qt6ct/colors/ (and qt5ct/colors/), then pick it in qt6ct.
; the roles, in order: window text, button, light, midlight, dark, mid, text,
; bright text, button text, base, window, shadow, highlight, highlighted text,
; link, visited link, alternate base, no role, tooltip base, tooltip text,
; placeholder text, accent
[ColorScheme]
active_colors={{fg}}, {{raised}}, {{selection}}, {{region}}, {{deep}}, {{panel}}, {{fg}}, {{pinktext}}, {{fg}}, {{bg}}, {{panel}}, #000000, {{orchid}}, {{deep}}, {{blue}}, {{violet}}, #62577a, {{deep}}, {{deep}}, {{fg}}, {{dim}}, {{orchid}}
inactive_colors={{fg}}, {{raised}}, {{selection}}, {{region}}, {{deep}}, {{panel}}, {{fg}}, {{pinktext}}, {{fg}}, {{bg}}, {{panel}}, #000000, {{selection}}, {{fg}}, {{blue}}, {{violet}}, #62577a, {{deep}}, {{deep}}, {{fg}}, {{dim}}, {{selection}}
disabled_colors={{dim}}, {{panel}}, {{raised}}, {{raised}}, {{deep}}, {{panel}}, {{dim}}, {{dim}}, {{dim}}, {{bg}}, {{panel}}, #000000, {{raised}}, {{dim}}, {{dim}}, {{dim}}, #62577a, {{deep}}, {{deep}}, {{dim}}, {{dim}}, {{raised}}
