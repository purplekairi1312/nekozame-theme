# nekozame for tmux. generated from palette.toml by generate.py; edit the palette there.
# windows as rounded tabs (needs a nerd font for the round ends).
# use it with: source-file /path/to/nekozame.conf

set -g status-justify left
set -g status-style 'bg={{deep}} fg={{pink}}'
set -g status-left '#[fg={{orchid}},bold] ❀ #S  '
set -g status-left-length 30
set -g status-right '#[fg={{selection}}]#[bg={{selection}},fg={{softwhite}}] %H:%M #[bg={{deep}},fg={{selection}}]'
set -g status-right-length 30
set -g window-status-separator ' '
setw -g window-status-format '#[fg={{selection}}]#[bg={{selection}},fg={{softwhite}}] #I #W #[bg={{deep}},fg={{selection}}]'
setw -g window-status-current-format '#[fg={{orchid}}]#[bg={{orchid}},fg={{deep}},bold] #I #W #[bg={{deep}},fg={{orchid}}]'
setw -g window-status-bell-style 'fg={{deep}} bg={{error}} bold'

set -g pane-border-style 'fg={{selection}}'
set -g pane-active-border-style 'fg={{orchid}}'
set -g message-style 'fg={{deep}} bg={{pink}} bold'
set -g message-command-style 'fg={{deep}} bg={{pink}}'
setw -g mode-style 'fg={{deep}} bg={{orchid}} bold'
setw -g clock-mode-colour '{{orchid}}'
